server {
    listen 80;
    server_name _;
    root /var/www/classroom/public;
    index index.php;
    client_max_body_size 2m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; media-src 'self' https://*.aliyuncs.com blob:; img-src 'self' data:; frame-ancestors 'self'" always;
    location /ws {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/classroom/public/index.php;
        fastcgi_pass app:9000;
    }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
}
