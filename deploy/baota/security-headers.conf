# Included in each TLS location that defines add_header (Nginx inheritance).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy no-referrer always;
add_header X-Content-Type-Options nosniff always;
add_header Permissions-Policy "microphone=(self), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://t.xuanknow.cn wss://esa.t.xuanknow.cn; media-src 'self' https://*.aliyuncs.com blob:; img-src 'self' data:; frame-ancestors 'self'" always;
