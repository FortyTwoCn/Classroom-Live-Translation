; PHP_INI_SCAN_DIR uses an initial empty item to retain PHP's default scan dir.
; Child PHP processes inherit this scan dir, unlike command-line -d overrides.
disable_functions = exec,passthru,shell_exec,system,popen,dl,show_source,pcntl_exec
display_errors = Off
log_errors = On
expose_php = Off
error_log = /www/wwwroot/t.xuanknow.cn/storage/logs/php-cli.log
memory_limit = 256M
max_execution_time = 0
upload_max_filesize = 4M
post_max_size = 5M
date.timezone = UTC
