; Dedicated FPM master only. Never replace the shared BaoTa PHP8.5 php.ini.
; These are the dynamic extensions present in the inspected PHP8.5 runtime;
; other required extensions are compiled in and must be checked after start.
extension = zip.so
extension = pdo_pgsql.so
extension = fileinfo.so

engine = On
short_open_tag = Off
expose_php = Off
enable_dl = Off
disable_functions = exec,passthru,shell_exec,system,popen,dl,show_source,pcntl_exec
zend.exception_ignore_args = On
memory_limit = 256M
max_execution_time = 110
max_input_time = 60
max_input_vars = 3000
post_max_size = 5M
upload_max_filesize = 4M
file_uploads = On
upload_tmp_dir = /www/wwwroot/t.xuanknow.cn/storage/app/tmp
sys_temp_dir = /www/wwwroot/t.xuanknow.cn/storage/app/tmp
default_charset = UTF-8
variables_order = EGPCS
request_order = GP
register_argc_argv = Off
auto_globals_jit = On
precision = 14
serialize_precision = -1
output_buffering = 4096
implicit_flush = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /www/wwwroot/t.xuanknow.cn/storage/logs/php-fpm.log
allow_url_fopen = On
allow_url_include = Off
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 120
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
openssl.capath = /etc/ssl/certs
