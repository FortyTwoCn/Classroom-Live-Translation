# Install as this site's BaoTa vhost; do not also include enable-php-85.conf.
# This file is included by Nginx inside http {}, so map is valid here.
map $uri $clt_access_loggable {
    default 1;
    ~^/s(?:/|$) 0;
}

server {
    listen 80;
    server_name t.xuanknow.cn esa.t.xuanknow.cn;
    root /www/wwwroot/t.xuanknow.cn/public;
    access_log /www/wwwlogs/t.xuanknow.cn.log combined if=$clt_access_loggable;
    error_log /www/wwwlogs/t.xuanknow.cn.error.log warn;

    if ($host !~ ^(?:t\.xuanknow\.cn|esa\.t\.xuanknow\.cn)$) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name t.xuanknow.cn esa.t.xuanknow.cn;
    root /www/wwwroot/t.xuanknow.cn/public;
    index index.php;
    server_tokens off;
    ssl_certificate /www/server/panel/vhost/cert/t.xuanknow.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/t.xuanknow.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:clt_tls:10m;
    ssl_session_tickets off;
    client_max_body_size 5m;
    access_log /www/wwwlogs/t.xuanknow.cn.log combined if=$clt_access_loggable;
    error_log /www/wwwlogs/t.xuanknow.cn.error.log warn;

    if ($host !~ ^(?:t\.xuanknow\.cn|esa\.t\.xuanknow\.cn)$) { return 444; }

    include /www/wwwroot/t.xuanknow.cn/deploy/baota/security-headers.conf;
    add_header Cache-Control "no-store, private" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Browser heartbeat is every 5 seconds; only this exact endpoint upgrades.
    location = /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Vite hashes asset contents. Missing assets must never fall back to HTML.
    location ~ "^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|svg|webp)$" {
        try_files $uri =404;
        include /www/wwwroot/t.xuanknow.cn/deploy/baota/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ { try_files $uri =404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/t.xuanknow.cn/public/index.php;
        fastcgi_param DOCUMENT_ROOT /www/wwwroot/t.xuanknow.cn/public;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_pass unix:/run/clt/php-fpm.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 125s;
        fastcgi_send_timeout 125s;
        fastcgi_cache off;
        fastcgi_hide_header Cache-Control;
        include /www/wwwroot/t.xuanknow.cn/deploy/baota/security-headers.conf;
        add_header Cache-Control "no-store, private" always;
    }

    location ~ /\. { deny all; }
    location ~ \.php(?:/|$) { return 404; }
}
