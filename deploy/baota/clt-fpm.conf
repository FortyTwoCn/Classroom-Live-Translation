; Included only by this site's php-fpm.master.conf, with its own php-fpm.ini.
; Do not add this pool to the existing BaoTa [www] master or change its socket.
[clt]
user = cltweb
group = cltweb
listen = /run/clt/php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0600
listen.backlog = 128
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 120s
request_terminate_timeout_track_finished = yes
catch_workers_output = yes
decorate_workers_output = yes
clear_env = yes
security.limit_extensions = .php
chdir = /www/wwwroot/t.xuanknow.cn
env[APP_ENV] = production
env[LARAVEL_STORAGE_PATH] = /www/wwwroot/t.xuanknow.cn/storage
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /www/wwwroot/t.xuanknow.cn/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 110
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 5M
php_admin_value[upload_tmp_dir] = /www/wwwroot/t.xuanknow.cn/storage/app/tmp
php_admin_value[sys_temp_dir] = /www/wwwroot/t.xuanknow.cn/storage/app/tmp
; Pool disable_functions appends to the dedicated master ini. Both lists
; retain proc_open/readlink/putenv. The shared BaoTa master remains untouched.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,dl,show_source,pcntl_exec
; open_basedir is optional: site:/tmp alone can break CA/certificate lookups.
; If enabled, test TLS and Excel uploads before switching traffic.
; php_admin_value[open_basedir] = /www/wwwroot/t.xuanknow.cn:/tmp:/etc/ssl/certs:/usr/share/zoneinfo
